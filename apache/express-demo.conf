<VirtualHost *:80>
    ServerName demo.example.com
    ProxyRequests Off
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:3001/
    ProxyPassReverse / http://127.0.0.1:3001/
    ErrorLog ${APACHE_LOG_DIR}/express-demo-error.log
    CustomLog ${APACHE_LOG_DIR}/express-demo-access.log combined
</VirtualHost>
