name: hosting-jenkins
services:
  jenkins:
    build: .
    # Simple personal-server demo: Docker socket access grants host-level control.
    user: "0:0"
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      JAVA_OPTS: "-Xms256m -Xmx768m"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    mem_limit: 1536m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  jenkins_home:
